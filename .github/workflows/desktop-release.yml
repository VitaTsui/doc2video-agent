# 桌面版发布：三端各自构建运行时与安装包，挂到已有的 Release 上。
#
# 由 release.yml 打完 tag 后触发，而不是自己去打 tag——版本号只有一个来源
# （pyproject.toml），两套流程各自推断会在某次不同步时发出一个装不上运行时
# 的安装包。
#
# 每个平台都必须在自己的 runner 上跑：解释器、ffmpeg 轮子、Remotion 的原生
# compositor、Node 二进制全是按平台分发的，一个都交叉编不出来。
name: desktop-release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 要发布的版本号（不带 v）
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      # 一个平台失败不该埋掉另外两个的产物——三个包是分别可用的。
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: macos-arm64
          # Intel macOS 暂缺：macos-13 的 runner 已经排不到队，而一个永远不
          # 开始的 job 会让整个 run 结束不了，别的平台的产物也发不出去。等换到
          # 可用的 Intel 标签再加回来。
          - os: ubuntu-22.04
            target: linux-x64
          - os: windows-latest
            target: windows-x64
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 11

      # Tauri 在 Linux 上要 webkit2gtk 才能编译。
      - name: Linux 构建依赖
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libssl-dev

      # 缺 key 的话 Tauri 会在构建到一半时报一句很难懂的话，而三个平台都会
      # 报——先在这里说清楚是哪个 secret 没配。
      - name: 检查签名密钥
        shell: bash
        run: |
          if [ -z "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" ]; then
            echo "缺少 secret TAURI_SIGNING_PRIVATE_KEY：自更新的包必须签名。" >&2
            echo "用 pnpm tauri signer generate 生成，把私钥内容整段贴进仓库 secret。" >&2
            exit 1
          fi

      - name: 版本号
        id: ver
        shell: bash
        run: |
          version="${{ github.event.inputs.version }}"
          [ -n "$version" ] || version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # 运行时：解释器 + 流水线 + ffmpeg + 语音 + 字体（+ Remotion）。
      # 这一步产出的 tar.gz 和 sha256 就是应用首次启动时下载的东西。
      - name: 构建运行时
        shell: bash
        run: uv run python scripts/build_runtime.py --out dist/runtime --version "${{ steps.ver.outputs.version }}"

      - name: 运行时自检
        shell: bash
        run: |
          # 必须能在不依赖仓库、不依赖构建机 Python 的情况下跑起来——这正是
          # 上一版用虚拟环境时会悄悄坏掉的地方。env -i 清空环境，只留一个可写
          # 的 storage 目录：没有它 storage_dir 会落到 cwd 下，而 cwd 是 /。
          work="$RUNNER_TEMP/selfcheck"
          mkdir -p "$work"
          if [ "${{ runner.os }}" = "Windows" ]; then
            D2V_STORAGE_DIR="$work" ./dist/runtime/python/python.exe -m doc2video.cli doctor
          else
            (cd / && env -i "D2V_STORAGE_DIR=$work" \
              "$GITHUB_WORKSPACE/dist/runtime/python/bin/python3" -m doc2video.cli doctor)
          fi

      # 签名是自更新的全部安全性所在：应用只认这一个公钥签出来的包，
      # 所以 GitHub Release 被替换了也装不进去。
      - name: 构建安装包
        working-directory: desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          pnpm install
          pnpm tauri build

      - name: 收集产物
        shell: bash
        run: |
          mkdir -p out
          cp dist/*.tar.gz dist/*.sha256 out/ 2>/dev/null || true
          # .app.tar.gz 和 .sig 是给自更新用的，dmg/msi/deb 是给人下载的。
          find desktop/src-tauri/target/release/bundle \
            -type f \( -name '*.dmg' -o -name '*.msi' -o -name '*.exe' \
            -o -name '*.AppImage' -o -name '*.deb' \
            -o -name '*.rpm' -o -name '*.app.tar.gz' -o -name '*.sig' \) -exec cp {} out/ \;
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: out/*

      # 手动触发也要能上传：用 GITHUB_TOKEN 创建的 Release 不会触发别的工作流
      # （GitHub 防递归），所以 release 事件在这个仓库里根本不会到来——只认它
      # 等于这一步永远跑不到。
      - name: 挂到 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: gh release upload "v${{ steps.ver.outputs.version }}" out/* --clobber

  # latest.json 必须等三个平台都构建完：它是一份清单，缺一个平台就等于那个
  # 平台的用户永远收不到更新提示。
  manifest:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 版本号
        id: ver
        shell: bash
        run: |
          version="${{ github.event.inputs.version }}"
          [ -n "$version" ] || version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 生成 latest.json
        shell: bash
        run: python3 scripts/updater_manifest.py artifacts "${{ steps.ver.outputs.version }}" latest.json

      - name: 挂到 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "v${{ steps.ver.outputs.version }}" latest.json --clobber
