# The desktop shell: a window over the backend's own HTTP API, the process that
# serves it, and the user's keys. It carries no product logic — the pipeline is
# in Python and stays there.
[package]
name = "doc2video-desktop"
version = "0.7.2"
description = "Doc2Video 桌面版：把 PPT / PDF 变成讲解视频"
license = "MIT"
repository = "https://github.com/VitaTsui/doc2video-agent"
edition = "2021"
rust-version = "1.82"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
# Keys live in the OS credential store, never on disk: macOS Keychain,
# Windows Credential Manager, Linux Secret Service.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
rand = "0.8"
ureq = "2"
# The runtime arrives as a tar.gz with a checksum beside it: unpack it here
# rather than shelling out to tar, which Windows does not have.
flate2 = "1"
tar = "0.4"
sha2 = "0.10"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[target."cfg(unix)".dependencies]
# The window's own close path runs Drop; a signal does not, and a backend left
# behind by `kill` keeps a port and, mid-render, a core.
signal-hook = "0.3"

[features]
custom-protocol = ["tauri/custom-protocol"]
