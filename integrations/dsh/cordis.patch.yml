# 把 doc2video 挂进 DeepSeek Harness（dsh）。
#
# 用法：
#   dsh --profile <你的 profile> --patch /绝对路径/integrations/dsh/cordis.patch.yml
# 或把下面这段 insert 追加到 ~/.dsh/profiles/<profile>/cordis.patch.yml。
#
# 前置：
#   1. 本机先起后端：D2V_API_TOKEN=<token> doc2video serve --port 8393
#   2. 该 profile 里装过桥接插件：dsh plugin --profile <profile> add @deepseek-ai/dsh-mcp-client
#
# 挂上之后模型会多出 8 个工具，名字统一带前缀：mcp__doc2video__*。
- insert:
    - id: doc2video
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: doc2video
        transport: streamable-http
        # 末尾这个斜杠是必须的：/mcp 会 307 跳到 /mcp/，而 307 之后的 POST
        # 不是每个客户端都会原样重发。
        url: !!js "process.env.D2V_MCP_URL?.trim() || 'http://127.0.0.1:8393/mcp/'"
        headers:
          # 后端没设 D2V_API_TOKEN 时它不鉴权，这一行传空也无妨。
          # 反引号在 YAML 里是保留字符，`!!js` 表达式必须整条引起来。
          Authorization: !!js "`Bearer ${process.env.D2V_API_TOKEN ?? ''}`"
        # 解析一份 30 页的 PDF 要十几秒，默认 60 秒够；真正耗时的渲染不在
        # 这条通道上——render_video 立刻返回 job_id，进度靠 job_status 轮询。
        toolCallTimeoutMs: 120000
        # 后端没起的时候，让整棵树照常启动、只是没有这几个工具，而不是
        # 连不上就不让 dsh 开机。
        failOnStartupError: false
